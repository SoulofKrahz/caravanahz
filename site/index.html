/* Color de acento: genera la paleta clara y oscura con el contraste mínimo garantizado (mismo motor que Noticiahz) */
window.czAcc=function(h,s){
 var C=function(h,s,l){s=Math.max(0,Math.min(1,s));l=l/100;var a=s*Math.min(l,1-l),f=function(n){var k=(n+h/30)%12;return l-a*Math.max(-1,Math.min(k-3,9-k,1))};return[f(0),f(8),f(4)]};
 var hx=function(r){return'#'+r.map(function(v){return('0'+Math.round(v*255).toString(16)).slice(-2)}).join('')};
 var Lm=function(r){var q=r.map(function(v){return v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4)});return .2126*q[0]+.7152*q[1]+.0722*q[2]};
 var cr=function(a,b){var x=Lm(a),y=Lm(b);return(Math.max(x,y)+.05)/(Math.min(x,y)+.05)};
 var W=[1,1,1],N=function(x){return[parseInt(x.slice(1,3),16)/255,parseInt(x.slice(3,5),16)/255,parseInt(x.slice(5,7),16)/255]};
 var bg=N('#f4f6fa');
 var l=34;while(l>10&&cr(C(h,s,l),W)<5.6)l--;var em=C(h,s,l);
 var l2=Math.min(l+7,42);while(l2>l&&cr(C(h,s,l2),bg)<3.2)l2--;var e2=C(h,s,l2);
 var tint=C(h,.55*s,94),cdD=N('#152033');
 var ld=58;while(ld<90&&cr(C(h,s*.75,ld),cdD)<6.5)ld++;var emD=C(h,s*.75,ld);
 var e2D=C(h,s*.8,Math.max(ld-12,36)),onD=C(h,.6,6);
 var css='html:root{--em:'+hx(em)+';--em2:'+hx(e2)+';--tint:'+hx(tint)+';--onem:#fff}'
  +'html[data-theme=dark]{--em:'+hx(emD)+';--em2:'+hx(e2D)+';--tint:hsla('+Math.round(h)+','+Math.round(s*80)+'%,48%,.14);--onem:'+hx(onD)+'}';
 // lt: el color es oscuro y la furgoneta del icono va en blanco (en negro no se vería)
 return{css:css,barL:hx(em),barD:'#0d1523',fav:hx(e2),lt:cr(e2,N('#06150f'))<3.6}};
window.czApply=function(h,s){var st=document.getElementById('acs');if(h==null||isNaN(h)){if(st)st.remove();window.czLast=null;return null}var a=czAcc(+h,s==null?.85:+s);if(!st){st=document.createElement('style');st.id='acs';document.head.appendChild(st)}st.textContent=a.css;window.czLast=a;return a};
/* Icono de la app instalada: cada color de la paleta tiene iconos y manifest propios (ic/, manifest-<color>.webmanifest).
   La dirección del manifest no cambia nunca (si cambia, Android no actualiza el icono): la app deja el color en la
   cookie cz_ic y _worker.js sirve en manifest.webmanifest el de ese color. Un color personalizado usa el más parecido. */
window.czIco=function(h,s){if(h==null||isNaN(h))return'';h=+h;s=s==null?.85:+s;if(s<.3)return'grafito';var P=[['',160],['turquesa',185],['azul',214],['indigo',243],['violeta',272],['rosa',328],['coral',6],['naranja',27],['ambar',42],['oliva',80]],b=P[0],d=1e9;P.forEach(function(x){var e=Math.abs(h-x[1])%360;e=Math.min(e,360-e);if(e<d){d=e;b=x}});return b[0]};
window.czMan=function(h,s){var k=czIco(h,s),a=document.querySelector('link[rel=apple-touch-icon]');try{document.cookie='cz_ic='+(k||'')+';path=/;max-age=31536000;SameSite=Lax'+(location.protocol==='https:'?';Secure':'')}catch(e){}if(a)a.setAttribute('href',k?'ic/'+k+'-apple.png':'icons/apple-touch-icon.png');return k};
try{var p=JSON.parse(localStorage.getItem('cz_pf'))||{},t=p.th;if(t!=='dark'&&t!=='light')t=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';var d=document.documentElement;d.dataset.theme=t;d.style.setProperty('--fs',p.fs||1.12);if(p.sm!==false)d.classList.add('simple');if(p.rm)d.classList.add('rm');if(p.ah!=null)czApply(p.ah,p.as);czMan(p.ah,p.as)}catch(e){}
